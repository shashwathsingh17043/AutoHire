<!DOCTYPE html>
<html>
<head>
    <title>AutoHire Dashboard</title>

    <style>
        body {
            background: #020617;
            color: white;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            color: cyan;
        }

        .card {
            background: rgba(255,255,255,0.05);
            margin: 20px auto;
            padding: 20px;
            width: 60%;
            border-radius: 10px;
        }

        .top {
            border: 2px solid lime;
        }

        .badge {
            background: cyan;
            color: black;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 20px;
            display: inline-block;
        }

        .missing {
            background: red;
            color: white;
        }

        .score {
            font-size: 20px;
            color: #22c55e;
        }
    </style>
</head>

<body>

<h1>Candidate Ranking</h1>

{% for c in results %}
<div class="card {% if loop.index == 1 %}top{% endif %}">
    <h3>{{loop.index}}. {{c.name}}</h3>

    <p class="score">Score: {{c.score}}</p>

<div style="background:#111; border-radius:6px; height:8px;">
    <div style="width: {{c.score}}%; background:cyan; height:100%;"></div>
</div>
    <p>
<strong>Decision:</strong>
<span style="
color:
{% if c.decision == 'Highly Recommended' %}lime
{% elif c.decision == 'Consider' %}orange
{% else %}red{% endif %}
;">
{{c.decision}}
</span>
</p>
    <p><strong>Matched Skills:</strong></p>
    <div>
        {% for skill in c.skills %}
            <span class="badge">{{skill}}</span>
        {% endfor %}
    </div>

    <p><strong>Missing Skills:</strong></p>
    <div>
        {% for skill in c.missing %}
            <span class="badge missing">{{skill}}</span>
        {% endfor %}
    </div>
</div>
{% endfor %}

</body>
</html>
